name: Backend quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quality
          POSTGRES_PASSWORD: quality-test-only
          POSTGRES_DB: surmesure_quality_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quality -d surmesure_quality_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://quality:quality-test-only@127.0.0.1:5432/surmesure_quality_test
      TEST_DATABASE_URL: postgresql://quality:quality-test-only@127.0.0.1:5432/surmesure_quality_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npm audit --omit=dev
      - run: npm run check
