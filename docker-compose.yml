services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: surmesure
      POSTGRES_PASSWORD: surmesure
      POSTGRES_DB: surmesure
    ports: ["5434:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surmesure"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://surmesure:surmesure@postgres:5432/surmesure?schema=public&connection_limit=20
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres_data:
